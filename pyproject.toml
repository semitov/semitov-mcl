[project]
name = "semitov-mcl"
version = "0.1.0"
description = "Micropython compatibility layer."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyserial>=3.5",
]
authors = [
    { name = "SemiTO-V", email = "semitofive@gmail.com" }
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/semitov/SemiTOV-MCL"
Repository = "https://github.com/semitov/SemiTOV-MCL"

[project.optional-dependencies]
gui-example = [
    "pyqt6>=6.9.1",
    "qt-material>=2.17",
]

[dependency-groups]
dev = [
    "pyright>=1.1.406",
    "pytest>=8.4.2",
]
